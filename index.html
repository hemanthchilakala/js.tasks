<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>body{
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}
form{
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    background: linear-gradient(orangered,white,darkgreen);
    width: 300px;
    height: 400px;
    border-radius: 20px;
}
input{
    height: 30px;
    width: 220px;
    border: none;
    border-radius: 20px;
    margin-bottom: 15px;color: red;
    font-size: 17px;
}
label{
    font-family: Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif;
    letter-spacing: 2px;
    font-size: 17px;
    margin-bottom: 5px;
}
button{
    font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
    font-size: 15px;
    border: none;
    padding: 8px 12px;
    border-radius: 10px;
    
}
.btn{
    display: flex;
    flex-wrap: wrap;
    gap: 20px;
    justify-content: center;
    margin-top: 20px;
}</style>
    <script>
        function Addthree(){
            var num1  = Number(document.getElementById("text-b1").value);
            var num2  = Number(document.getElementById("text-b2").value);
            var sum = num1 + num2 ;
            document.getElementById("result").value = sum;
            return false;

        }
        function Subthree(){
            var num1  = Number(document.getElementById("text-b1").value);
            var num2  = Number(document.getElementById("text-b2").value);
            var sum = num1 - num2 ;
            document.getElementById("result").value = sum;
            return false;

        }
        function Multhree(){
            var num1  = Number(document.getElementById("text-b1").value);
            var num2  = Number(document.getElementById("text-b2").value);
            var sum = num1 * num2 ;
            document.getElementById("result").value = sum;
            return false;

        }
        function Divthree(){
            var num1  = Number(document.getElementById("text-b1").value);
            var num2  = Number(document.getElementById("text-b2").value);
            var sum = num1 / num2 ;
            document.getElementById("result").value = sum;
            return false;

        }
        function Modthree(){
            var num1  = Number(document.getElementById("text-b1").value);
            var num2  = Number(document.getElementById("text-b2").value);
            var sum = num1 % num2 ;
            document.getElementById("result").value = sum;
            return false;

        }
    </script>
</head>
<body>
    <form >
        <label>Enter num1</label>
        <input type="text" id="text-b1">

        <label>Enter num2</label>
        <input type="text" id="text-b2">

        <label>Result :</label>
        <input type="text" id="result" readonly /> <br />
<div class="btn">
        <button onclick=" return Addthree()">ADD</button>
        <button onclick=" return Subthree()">SUB</button>
        <button onclick=" return Multhree()">MUL</button>
        <button onclick=" return Divthree()">DIV</button>
        <button onclick=" return Modthree()">MOD</button>
    </div>
    </form>
</body>
</html>
